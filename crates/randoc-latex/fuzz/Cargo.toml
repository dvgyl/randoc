[package]
name = "randoc-latex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
randoc-ast = { path = "../../randoc-ast" }
randoc-core = { path = "../../randoc-core" }
randoc-latex = { path = ".." }

[[bin]]
name = "write"
path = "fuzz_targets/write.rs"
test = false
doc = false
bench = false

# The fuzz crate is not a member of the main workspace.
[workspace]
