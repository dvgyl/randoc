[package]
name = "randoc-markdown-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
randoc-core = { path = "../../randoc-core" }
randoc-markdown = { path = ".." }

[[bin]]
name = "markdown_read"
path = "fuzz_targets/markdown_read.rs"
test = false
doc = false
bench = false

# The fuzz crate is not a member of the main workspace.
[workspace]
