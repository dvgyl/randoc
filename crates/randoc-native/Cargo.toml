[package]
name = "randoc-native"
description = "The native reader and writer of Randoc: the Haskell show form of the document tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
randoc-ast = { workspace = true }
randoc-core = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
toml = { workspace = true }

# The CPU time of the test thread for the time tests, which ignores the
# time that a loaded machine makes the thread wait. The time tests run on
# Unix only.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["time"] }

[lints]
workspace = true
