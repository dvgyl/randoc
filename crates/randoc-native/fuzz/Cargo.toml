[package]
name = "randoc-native-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
randoc-ast = { path = "../../randoc-ast" }
randoc-core = { path = "../../randoc-core" }
randoc-native = { path = ".." }

[[bin]]
name = "native_read"
path = "fuzz_targets/native_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_roundtrip"
path = "fuzz_targets/native_roundtrip.rs"
test = false
doc = false
bench = false

# The fuzz crate is not a member of the main workspace.
[workspace]
