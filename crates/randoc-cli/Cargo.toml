[package]
name = "randoc-cli"
description = "The command-line program of Randoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "randoc"
path = "src/main.rs"

[features]
default = ["lua"]
lua = ["dep:randoc-lua"]

[dependencies]
randoc = { workspace = true }
randoc-archive = { workspace = true }
randoc-bibtex = { workspace = true }
randoc-citeproc = { workspace = true }
randoc-data = { workspace = true }
randoc-highlight = { workspace = true }
randoc-layout = { workspace = true }
randoc-templates = { workspace = true }
randoc-yaml = { workspace = true }
# Lua filters; a WebAssembly build turns the feature off (ADR 11).
randoc-lua = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
randoc-harness = { path = "../randoc-harness" }

[lints]
workspace = true
