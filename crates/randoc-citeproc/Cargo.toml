[package]
name = "randoc-citeproc"
description = "The CSL processor of Randoc: a port of the Haskell library citeproc 0.14.1.1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
randoc-ast = { workspace = true }
randoc-core = { workspace = true }
randoc-data = { workspace = true }
quick-xml = { workspace = true }

# The CPU time of the process for tests/time.rs. `ps` is refused in the
# build sandbox.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["time"] }

[lints]
workspace = true
