# Exit gates of the milestones of plan/ROADMAP.md.
# Format: plan/SPEC.md and the data model of the build operations.
# `ops milestone check ID` reads this file. A threshold can rise. A threshold never falls.
# Two entries for one metric mean that both must hold.
# Requirement kinds (plan/SPEC.md 4.1): exists (a row with TOTAL above 0), min_pass, min_fraction,
# min_total, exact_total. The check uses one candidate run: the newest full, clean build run.
# fmt.read.F and fmt.write.F are the per-format rows of the pivot measurement (ROADMAP, "Metric keys").

