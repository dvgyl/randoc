# Pandoc's own test suite, read at run time from $RANDOC_PANDOC_SRC/test (never committed).
# docs/PANDOC_TESTSUITE.md gives the pass rule of each group. A test where the oracle
# gave no result (heap limit, time limit) is of class oracle-limit and not in TOTAL.

[[metric]]
key = "suite.pandoc"
suite = "pandoc"
status = "active"
command = "{python} tools/pandoc-testsuite/run.py --pandoc {randoc} --oracle {oracle} --suite {pandoc_src}/test --out {evidence}/pandoc-report.json --jobs 2 --show-failures"
pass = "tests that pass"
total = "supported tests that are not excluded (totals.run of the report), minus oracle-limit tests"

[[metric]]
key = "suite.pandoc.command"
suite = "pandoc"
status = "active"
command = "{python} tools/pandoc-testsuite/run.py --pandoc {randoc} --oracle {oracle} --suite {pandoc_src}/test --out {evidence}/pandoc-report.json --jobs 2 --show-failures"
pass = "tests of the group command (test/command/*.md code blocks) that pass"
total = "tests of the group command that are not excluded, minus oracle-limit tests"

[[metric]]
key = "suite.pandoc.old"
suite = "pandoc"
status = "active"
command = "{python} tools/pandoc-testsuite/run.py --pandoc {randoc} --oracle {oracle} --suite {pandoc_src}/test --out {evidence}/pandoc-report.json --jobs 2 --show-failures"
pass = "tests of the group old (golden files of Tests/Old.hs) that pass"
total = "tests of the group old that are not excluded, minus oracle-limit tests"

[[metric]]
key = "suite.pandoc.readers"
suite = "pandoc"
status = "active"
command = "{python} tools/pandoc-testsuite/run.py --pandoc {randoc} --oracle {oracle} --suite {pandoc_src}/test --out {evidence}/pandoc-report.json --jobs 2 --show-failures"
pass = "tests of the groups readers/* (the oracle reads the expected file to JSON) that pass"
total = "tests of the groups readers/* that are not excluded, minus oracle-limit tests"

# The visible corpus of real documents in $RANDOC_CORPUS (tools/corpus/manifest.toml).
# A unit is (document, target); it passes when the exit code, standard error and
# output are equal (json by JSON value equality, the others by bytes). A unit where the
# oracle gave no result (status "oracle timeout" or "error oracle") is of class
# oracle-limit and not in TOTAL.

[[metric]]
key = "corpus.units"
suite = "corpus"
status = "active"
command = "{python} tools/corpus/run.py --pandoc {randoc} --oracle {oracle} --corpus {corpus} --out {evidence}/corpus-report.json --jobs 2"
pass = "corpus units that pass"
total = "corpus units (each document of the manifest times the targets json, html and markdown), minus oracle-limit units"

[[metric]]
key = "corpus.json"
suite = "corpus"
status = "active"
command = "{python} tools/corpus/run.py --pandoc {randoc} --oracle {oracle} --corpus {corpus} --out {evidence}/corpus-report.json --jobs 2"
pass = "corpus units with target json that pass"
total = "corpus units with target json, minus oracle-limit units"

[[metric]]
