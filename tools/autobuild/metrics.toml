# The metrics of the scoreboard (plan/scoreboard/*.tsv). One entry for each metric key.
# tools/autobuild/measure.py reads this file; plan/SPEC.md explains the keys.
#
# status   "active": measure.py runs `command` and writes a row.
#          "to-build": no measurement exists yet, so there is no row.
#          "external": another tool writes the rows (the held-out evaluator).
# suite    The group of metrics that one command measures (`measure.py --suite NAME`).
#          Each active metric of a suite has the same command.
# command  measure.py splits it like a shell line and then fills the placeholders:
#          {python} this Python, {randoc} and {harness} copies of the debug programs
#          of the target folder (made once for each measurement run, with their
#          SHA-256 in the evidence, so that a build during the run changes
#          nothing), {oracle} $RANDOC_ORACLE_PANDOC, {pandoc_src}
#          $RANDOC_PANDOC_SRC, {corpus} $RANDOC_CORPUS, {evidence} the evidence
#          folder of the run. Write a literal brace as {{ or }}. The working
#          folder is the repository root.
#          `measure.py --filter TEXT` adds the filter option of the suite; a
#          filtered run writes evidence but no scoreboard row.
# pass     The exact definition of PASS.
# total    The exact definition of TOTAL.

# The conformance harness. A unit is a check of one case:
# CASE#read, CASE#write:TO, CASE#e2e:TO or CASE#cmd (conformance/README.md).
# A unit passes when the exit code, standard error and output equal the stored oracle result.
# Classes (plan/SPEC.md 3.11): pass; fail (fail, no_result, not_recorded); no input
# (skipped: a write unit whose oracle read unit exits with a code that is not 0).

[[metric]]
key = "harness.units"
suite = "harness"
status = "active"
command = "{harness} run --randoc {randoc} --jobs 4 --report {evidence}/harness-report.json --matrix {evidence}/capabilities.json"
pass = "harness units with status pass"
total = "harness units of class pass or fail (no-input units are not in TOTAL)"

[[metric]]
key = "harness.read"
suite = "harness"
status = "active"
command = "{harness} run --randoc {randoc} --jobs 4 --report {evidence}/harness-report.json --matrix {evidence}/capabilities.json"
pass = "#read units with status pass"
total = "#read units of class pass or fail"

