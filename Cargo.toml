[workspace]
resolver = "3"
# List each member. Do not use a glob: the coordinator adds one line for each new crate.
members = [
    "crates/randoc-ast",
    "crates/randoc-layout",
    "crates/randoc-templates",
    "crates/randoc-data",
    "crates/randoc-core",
    "crates/randoc",
    "crates/randoc-cli",
    "crates/randoc-harness",
    "crates/randoc-yaml",
    "crates/randoc-html",
    "crates/randoc-markdown",
    "crates/randoc-native",
    "crates/randoc-citeproc",
    "crates/randoc-math",
    "crates/randoc-lua",
    "crates/randoc-html-reader",
    "crates/randoc-commonmark",
]
# Each fuzz crate is its own workspace because it needs the nightly toolchain.
# Cargo has no glob for this list. A path that does not exist yet does no harm.
exclude = [
    "crates/randoc-ast/fuzz",
    "crates/randoc-citeproc/fuzz",
    "crates/randoc-cli/fuzz",
    "crates/randoc-commonmark/fuzz",
    "crates/randoc-html/fuzz",
    "crates/randoc-html-reader/fuzz",
    "crates/randoc-latex/fuzz",
    "crates/randoc-layout/fuzz",
    "crates/randoc-markdown/fuzz",
    "crates/randoc-math/fuzz",
    "crates/randoc-native/fuzz",
    "crates/randoc-templates/fuzz",
    "crates/randoc-yaml/fuzz",
    "crates/randoc-lua/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dvgyl/randoc"
homepage = "https://github.com/dvgyl/randoc"
authors = ["The Randoc contributors"]

[workspace.dependencies]
randoc-ast = { path = "crates/randoc-ast", version = "0.1.0" }
randoc-layout = { path = "crates/randoc-layout", version = "0.1.0" }
randoc-templates = { path = "crates/randoc-templates", version = "0.1.0" }
randoc-data = { path = "crates/randoc-data", version = "0.1.0" }
randoc-core = { path = "crates/randoc-core", version = "0.1.0" }
randoc = { path = "crates/randoc", version = "0.1.0" }
randoc-cli = { path = "crates/randoc-cli", version = "0.1.0" }
randoc-yaml = { path = "crates/randoc-yaml", version = "0.1.0" }
randoc-html = { path = "crates/randoc-html", version = "0.1.0" }
randoc-markdown = { path = "crates/randoc-markdown", version = "0.1.0" }
randoc-native = { path = "crates/randoc-native", version = "0.1.0" }
randoc-citeproc = { path = "crates/randoc-citeproc", version = "0.1.0" }
quick-xml = { version = "=0.42.0", default-features = false }
randoc-math = { path = "crates/randoc-math", version = "0.1.0" }
randoc-html-reader = { path = "crates/randoc-html-reader", version = "0.1.0" }
randoc-commonmark = { path = "crates/randoc-commonmark", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
saphyr-parser = "0.3.3"
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
randoc-lua = { path = "crates/randoc-lua", version = "0.1.0" }
# ADR 11: Lua 5.4.8 comes from the build script of `randoc-lua`, not from `lua-src`.
mlua = { version = "=0.12.2", default-features = false, features = ["lua54"] }
mlua-sys = { version = "=0.13.0", default-features = false, features = ["lua54", "external"] }
cc = "=1.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
dbg_macro = "warn"

# Debug information is off to keep builds fast and the target directory small.
[profile.dev]
debug = false

[profile.test]
debug = false

[profile.release]
debug = false
