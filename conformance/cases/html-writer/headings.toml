# Headings and sections, with and without section divs.
from = "markdown"
to = ["html", "html4"]

[[case]]
id = "h1-h6"
input = '''
# 1

## 2

### 3

#### 4

##### 5

###### 6
'''

[[case]]
id = "h7"
input = '''
####### seven
'''

[[case]]
id = "setext"
input = '''
Title
=====

Sub
---
'''

[[case]]
id = "heading-id"
input = '''
# Head {#custom}
'''

[[case]]
id = "heading-class"
input = '''
# Head {.cls}
'''

[[case]]
id = "heading-kv"
input = '''
# Head {k=v}
'''

[[case]]
id = "heading-all-attrs"
