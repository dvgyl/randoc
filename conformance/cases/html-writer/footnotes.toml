# Footnotes, their references and the notes section.
from = "markdown"
to = ["html", "html4"]

[[case]]
id = "note-simple"
input = '''
Text.[^1]

[^1]: The note.
'''

[[case]]
id = "note-inline"
input = '''
Text.^[Inline note.]
'''

[[case]]
id = "note-two"
input = '''
A[^a] B[^b]

[^a]: First.
[^b]: Second.
'''

[[case]]
id = "note-multi-para"
input = '''
A[^1]

[^1]: Para one.

    Para two.
'''

[[case]]
id = "note-code-last"
input = '''
A[^1]

[^1]: Text.

        code
'''

[[case]]
id = "note-list-last"
input = '''
A[^1]

[^1]: - item
'''

[[case]]
id = "note-in-heading"
input = '''
# H^[n]
'''

[[case]]
id = "note-in-list"
input = '''
- a^[n1]
- b^[n2]
'''

[[case]]
id = "note-in-table"
input = '''
| a |
|---|
| b^[n] |
'''

[[case]]
id = "note-in-note"
input = '''
A^[outer ^[inner]]
'''

[[case]]
id = "note-repeated-ref"
input = '''
A[^1] B[^1]

[^1]: Note.
'''

[[case]]
id = "note-markup"
input = '''
A^[*em* **strong** `code` [l](u)]
'''

[[case]]
id = "note-with-blockquote"
input = '''
A[^1]

[^1]: > quoted
'''

[[case]]
id = "note-long-wrap"
input = '''
A^[word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word ]
'''

[[case]]
id = "note-ten"
input = '''
n0^[note 0] n1^[note 1] n2^[note 2] n3^[note 3] n4^[note 4] n5^[note 5] n6^[note 6] n7^[note 7] n8^[note 8] n9^[note 9] n10^[note 10]
'''

[[case]]
id = "note-with-sections"
input = '''
# A

x^[n1]

# B

y^[n2]
'''

[[case]]
id = "note-in-blockquote"
input = '''
> a^[n]
'''

[[case]]
id = "note-heading-in-note"
input = '''
A[^1]

[^1]: # Heading in note

    text
'''
