# Probes of `latex_diff.py probe`: one command or environment in each context.
from = "latex"
to = []

[[case]]
id = "cmd-emph-para"
input = "Before \\emph{word} after.\n"

[[case]]
id = "cmd-emph-alone"
input = "\\emph{word}\n"

[[case]]
id = "cmd-emph-item"
input = "\\begin{itemize}\n\\item \\emph{word}\n\\end{itemize}\n"

[[case]]
id = "cmd-emph-cell"
input = "\\begin{tabular}{ll}\n\\emph{word} & x\\\\\n\\end{tabular}\n"

[[case]]
id = "cmd-emph-argument"
input = "\\emph{\\emph{word}}\n"

[[case]]
id = "cmd-emph-optional"
input = "\\emph[opt]{word}\n"

[[case]]
id = "cmd-emph-star"
input = "\\emph*{word}\n"

[[case]]
id = "cmd-emph-rawtex"
