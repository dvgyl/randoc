# Math in each delimiter form and environment, and the citation commands.
from = "latex"
to = []

[[case]]
id = "math-cite-001"
input = "$a+b$\n"

[[case]]
id = "math-cite-002"
input = "$ a $\n"

[[case]]
id = "math-cite-003"
input = "$$a$$\n"

[[case]]
id = "math-cite-004"
input = "\\(a\\)\n"

[[case]]
id = "math-cite-005"
input = "\\[a\\]\n"

[[case]]
