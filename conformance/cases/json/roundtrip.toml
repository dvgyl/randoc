{"pandoc-api-version":[1,23,1,2],"meta":{"m":{"t":"MetaMap","c":{"b":{"t":"MetaBool","c":true},"l":{"t":"MetaList","c":[{"t":"MetaString","c":"s"}]},"k":{"t":"MetaBlocks","c":[{"t":"HorizontalRule"}]}}}},"blocks":[{"t":"Plain","c":[]},{"t":"LineBlock","c":[[{"t":"Str","c":"a"}],[]]},{"t":"CodeBlock","c":[["",["rust"],[]],"fn main() {}"]},{"t":"RawBlock","c":["latex","\\x"]},{"t":"BlockQuote","c":[{"t":"Para","c":[]}]},{"t":"OrderedList","c":[[3,{"t":"UpperRoman"},{"t":"TwoParens"}],[[{"t":"Plain","c":[{"t":"Str","c":"x"}]}]]]},{"t":"BulletList","c":[[],[{"t":"HorizontalRule"}]]},{"t":"DefinitionList","c":[[[{"t":"Str","c":"term"}],[[{"t":"Plain","c":[{"t":"Str","c":"def"}]}]]]]},{"t":"Div","c":[["d",[],[]],[]]},{"t":"Figure","c":[["f",[],[]],[[{"t":"Str","c":"short"}],[{"t":"Plain","c":[{"t":"Str","c":"cap"}]}]],[{"t":"Plain","c":[]}]]},{"t":"Table","c":[["",[],[]],[null,[{"t":"Plain","c":[{"t":"Str","c":"cap"}]}]],[[{"t":"AlignLeft"},{"t":"ColWidthDefault"}],[{"t":"AlignRight"},{"t":"ColWidth","c":0.5}],[{"t":"AlignCenter"},{"t":"ColWidth","c":1.0e-3}]],[["",[],[]],[[["",[],[]],[[["",[],[]],{"t":"AlignDefault"},1,1,[{"t":"Plain","c":[{"t":"Str","c":"a"}]}]]]]]],[[["",[],[]],1,[],[[["",[],[]],[[["",[],[]],{"t":"AlignDefault"},2,3,[]]]]]]],[["",[],[]],[]]]}]}
