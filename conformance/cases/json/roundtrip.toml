# The JSON reader and the JSON writer.
from = "json"
to = ["json"]

[[case]]
id = "empty"
input = '{"pandoc-api-version":[1,23,1,2],"meta":{},"blocks":[]}'

[[case]]
id = "inlines"
input = '''
