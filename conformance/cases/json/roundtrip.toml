[[case]]
id = "version-two-parts"
input = '{"pandoc-api-version":[1,23],"meta":{},"blocks":[]}'

[[case]]
id = "key-order"
input = '{"blocks":[{"c":[{"c":"x","t":"Str"}],"t":"Para"}],"meta":{},"pandoc-api-version":[1,23,1,2]}'

[[case]]
id = "old-version"
input = '{"pandoc-api-version":[1,22],"meta":{},"blocks":[]}'

[[case]]
id = "missing-version"
input = '{"meta":{},"blocks":[]}'

[[case]]
id = "not-json"
