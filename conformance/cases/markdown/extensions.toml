from = "markdown+mark"
input = '''
==not closed
'''

[[case]]
id = "abbreviations-multiword"
from = "markdown+abbreviations"
input = '''
*[W3C]: World Wide Web Consortium
*[two words]: Two

W3C and two words.
'''

[[case]]
id = "wikilinks-both"
from = "markdown+wikilinks_title_after_pipe+wikilinks_title_before_pipe"
input = '''
[[A|B]]
'''

[[case]]
id = "tex-math-single-backslash-escaped"
from = "markdown+tex_math_single_backslash"
input = '''
\\(not math\\)
'''

[[case]]
id = "four-space-rule-nested"
from = "markdown+four_space_rule"
input = '''
- a
  - b
'''
