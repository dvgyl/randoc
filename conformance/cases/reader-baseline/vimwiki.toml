from = "vimwiki"

[[case]]
id = "headings-pump"
input = '''
= Pump inspection =
== Parts ==
Open the cover.
'''

[[case]]
id = "emphasis-pump"
input = '''
Fit the *Pump*. Turn it _slowly_. Use `check`.
'''

[[case]]
id = "unordered-list-pump"
input = '''
* Pump
  * Seal
  * Cover
* Tool
'''

[[case]]
id = "checkboxes-pump"
input = '''
* [ ] Check the Pump.
* [X] Check the clamp.
* [.] Record the result.
'''

[[case]]
id = "wiki-link-pump"
input = '''
Read [[PumpService|service instructions]].
'''

[[case]]
id = "image-pump"
input = '''
{{pump.png|View of the Pump}}
'''

[[case]]
id = "code-pump"
input = '''
{{{class="text"
check Pump
status
}}}
'''

[[case]]
id = "table-pump"
input = '''
| Part | Count |
|------+-------|
| Pump | 2 |
| Seal | 4 |
'''

[[case]]
id = "definitions-pump"
input = '''
Pump:: A part of the test assembly.
Seal:: A part under the cover.
'''

[[case]]
id = "page-directives-pump"
input = '''
%title Pump inspection
%toc
= Steps =
Close the cover.
'''

