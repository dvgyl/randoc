from = "creole"

[[case]]
id = "headings-pump"
input = '''
= Pump inspection =
== Parts ==
Open the cover.
'''

[[case]]
id = "emphasis-pump"
input = '''
Fit the **Pump**. Turn it //slowly//.
'''

[[case]]
id = "unordered-list-pump"
input = '''
* Pump
** Seal
** Cover
* Tool
'''

[[case]]
id = "ordered-list-pump"
input = '''
# Check the Pump.
## Check the clamp.
# Record the result.
'''

[[case]]
id = "links-pump"
input = '''
[[Service/Pump|Service instructions]] and [[https://example.org/parts]]
'''

[[case]]
id = "image-pump"
input = '''
{{pump.png|View of the Pump}}
'''

[[case]]
id = "literal-pump"
input = '''
Inspect the Pump.
{{{
a ** b // c
}}}
'''

[[case]]
id = "table-pump"
input = '''
|= Part |= Count |
| Pump | 2 |
| Seal | 4 |
'''

[[case]]
id = "line-breaks-pump"
input = '''
Pump check\\
Next line.

----
Install the cover.
'''

[[case]]
id = "escaped-markup-pump"
input = '''
Use ~**Pump~** as the label. Close the cover.
'''

