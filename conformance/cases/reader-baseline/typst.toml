id = "image"
files = { "lens.svg" = '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect x="1" y="1" width="6" height="6" fill="blue"/></svg>' }
input = '''
#image("lens.svg", alt: "A square lens")
'''
