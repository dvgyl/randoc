from = "pod"

[[case]]
id = "headings-pump"
input = '''
=pod

=head1 Pump inspection

=head2 Parts

Open the cover.

=cut
'''

[[case]]
id = "inline-pump"
input = '''
=pod

Fit the B<Pump>. Turn it I<slowly>. Use C<check>.

=cut
'''

[[case]]
id = "links-pump"
input = '''
=pod

Read L<Pump::Service/Steps> and L<parts|https://example.org/parts>.

=cut
'''

[[case]]
id = "entities-pump"
input = '''
=pod

The label for the Pump has E<lt> and E<gt>. Press B<C<Enter>>.

=cut
'''

[[case]]
id = "verbatim-pump"
input = '''
=pod

Start with this command.

  check pump
  status

=cut
'''

[[case]]
id = "bullets-pump"
input = '''
=pod

=over 4

=item *

Pump

=item *

Seal

=back

=cut
'''

[[case]]
id = "ordered-pump"
input = '''
=pod

=over

=item 1.

Check the Pump.

=item 2.

Fit the cover.

=back

=cut
'''

[[case]]
id = "definitions-pump"
input = '''
=pod

=over 4

=item Pump

Part of the test assembly.

=item Seal

Part under the cover.

=back

=cut
'''

[[case]]
id = "raw-directive-pump"
input = '''
=pod

=begin html

<p class="remark">Check the Pump.</p>

=end html

The test is complete.

=cut
'''

[[case]]
id = "inline-spaces-pump"
input = '''
=pod

Use S<Pump A-17> and F<pump.txt>. X<check_pump>Z<>

=cut
'''

