from = "tikiwiki"

[[case]]
id = "headings-pump"
input = '''
! Pump inspection
!! Parts
Open the cover.
'''

[[case]]
id = "emphasis-pump"
input = '''
Fit the __Pump__. Turn it ''slowly''.
'''

[[case]]
id = "unordered-list-pump"
input = '''
* Pump
** Seal
** Cover
* Tool
'''

[[case]]
id = "ordered-list-pump"
input = '''
# Check the Pump.
## Check the clamp.
# Record the result.
'''

[[case]]
id = "wiki-link-pump"
input = '''
Read ((PumpService|service instructions)).
'''

[[case]]
id = "external-link-pump"
input = '''
[https://example.org/parts|Pump parts]
'''

[[case]]
id = "image-pump"
input = '''
{img src="pump.png" alt="Pump diagram"}
'''

[[case]]
id = "code-pump"
input = '''
{CODE(caption=>Pump)}start --check
stop{CODE}
'''

[[case]]
id = "table-pump"
input = '''
|| Part | Count
Pump | 2
Seal | 4 ||
'''

[[case]]
id = "special-blocks-pump"
input = '''
::Pump inspection::
---
-=Parts=-
'''

