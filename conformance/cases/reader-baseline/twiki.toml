from = "twiki"

[[case]]
id = "headings-pump"
input = '''
---+ Pump inspection
---++ Parts
Open the cover.
'''

[[case]]
id = "emphasis-pump"
input = '''
Fit the *Pump*. Turn it _slowly_. Use =check=.
'''

[[case]]
id = "unordered-list-pump"
input = '''
   * Pump
      * Seal
      * Cover
   * Tool
'''

[[case]]
id = "ordered-list-pump"
input = '''
   1 Check the Pump.
      1 Check the clamp.
   1 Record the result.
'''

[[case]]
id = "wiki-link-pump"
input = '''
Read [[Main.PumpService][service instructions]].
'''

[[case]]
id = "external-link-pump"
input = '''
[[https://example.org/parts][Pump parts]]
'''

[[case]]
id = "verbatim-pump"
input = '''
<verbatim>
check Pump
status *
</verbatim>
'''

[[case]]
id = "table-pump"
input = '''
| *Part* | *Count* |
| Pump | 2 |
| Seal | 4 |
'''

[[case]]
id = "definition-pump"
input = '''
   $ Pump: A part of the test assembly.
   $ Seal: A part under the cover.
'''

[[case]]
id = "literal-names-pump"
input = '''
<noautolink>
PumpService is a label.
</noautolink>
%BR% End.
'''

