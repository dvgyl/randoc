from = "mdoc"

[[case]]
id = "synopsis-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh SYNOPSIS
.Nm pump
.Op Fl v
.Op Ar file
'''

[[case]]
id = "description-terms-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh DESCRIPTION
.Em Pump
.Xr service 8
.Pa /var/run/test
'''

[[case]]
id = "options-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh OPTIONS
.Bl -tag -width Ds
.It Fl p Ar pump
Report the part number.
.It Fl n
Display the result.
.El
'''

[[case]]
id = "list-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh PARTS
.Bl -bullet
.It
Pump
.It
Seal
.El
'''

[[case]]
id = "literal-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh EXAMPLES
.Bd -literal -offset indent
check pump
result=pass
.Ed
'''

[[case]]
id = "function-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh FUNCTIONS
.Ft int
.Fn test_pump "const char *name" "int count"
'''

[[case]]
id = "references-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh SEE ALSO
.Xr pump 5 ,
.Xr inspect 8
'''

[[case]]
id = "environment-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh ENVIRONMENT
.Ev PUMP_MODE
Selects the test mode.
'''

[[case]]
id = "authors-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh AUTHORS
.An Mira Lane
.Responsible Pump
.Mt mira@example.org
'''

[[case]]
id = "escaped-text-pump"
input = '''
.Dd November 18, 2026
.Dt PUMP 1
.Os
.Sh NAME
.Nm pump
.Nd check a test assembly
.Sh NOTES
.No Pump Li "a\\-b"
.Pp
.Dq Fit the cover.
'''

