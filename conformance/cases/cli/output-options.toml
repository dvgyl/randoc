# A later -V value joins an earlier JSON null; --variable-json replaces (cli-R9-09).

[[case]]
id = "variable-null-append-1"
cmd = ["-f", "json", "-t", "html", "--template=t.html", "--variable-json=x:null", "-V", "x=a"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[]}"
files = { "t.html" = "$for(x)$<$x$>$endfor$|$if(x)$y$endif$\n" }

