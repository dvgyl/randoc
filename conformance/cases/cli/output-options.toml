[[case]]
id = "filter-order-with-citeproc"
cmd = ["-f", "json", "-t", "json", "--lua-filter=up.lua", "--citeproc", "--bibliography=refs.json"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Cite\",\"c\":[[{\"citationId\":\"item1\",\"citationPrefix\":[],\"citationSuffix\":[],\"citationMode\":{\"t\":\"NormalCitation\"},\"citationNoteNum\":1,\"citationHash\":0}],[{\"t\":\"Str\",\"c\":\"[@item1]\"}]]}]}]}"
files = { "up.lua" = "function Str(el)\n  el.text = el.text:upper()\n  return el\nend\n", "refs.json" = "[{\"id\":\"item1\",\"type\":\"book\",\"title\":\"A Book\",\"author\":[{\"family\":\"Doe\",\"given\":\"Jane\"}],\"issued\":{\"date-parts\":[[2020]]}}]\n" }

