cmd = ["-f", "json", "-t", "json", "--lua-filter=nosuch.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[]}"
covers = ["opt:lua-filter"]

[[case]]
id = "lua-filter-syntax-error"
cmd = ["-f", "json", "-t", "json", "--lua-filter=bad.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[]}"
files = { "bad.lua" = "function (\n" }

[[case]]
id = "lua-filter-runtime-error"
cmd = ["-f", "json", "-t", "json", "--lua-filter=err.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Header\",\"c\":[1,[\"intro\",[],[]],[{\"t\":\"Str\",\"c\":\"Intro\"}]]},{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"Hello\"},{\"t\":\"Space\"},{\"t\":\"Str\",\"c\":\"world.\"}]},{\"t\":\"Header\",\"c\":[2,[\"sub\",[],[]],[{\"t\":\"Str\",\"c\":\"Sub\"}]]},{\"t\":\"CodeBlock\",\"c\":[[\"\",[],[]],\"a\\tb\"]}]}"
files = { "err.lua" = "function Str() error(\"boom\") end\n" }

[[case]]
id = "lua-filter-from-data-dir"
cmd = ["-f", "json", "-t", "json", "--data-dir=dd", "--lua-filter=up.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Header\",\"c\":[1,[\"intro\",[],[]],[{\"t\":\"Str\",\"c\":\"Intro\"}]]},{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"Hello\"},{\"t\":\"Space\"},{\"t\":\"Str\",\"c\":\"world.\"}]},{\"t\":\"Header\",\"c\":[2,[\"sub\",[],[]],[{\"t\":\"Str\",\"c\":\"Sub\"}]]},{\"t\":\"CodeBlock\",\"c\":[[\"\",[],[]],\"a\\tb\"]}]}"
files = { "dd/filters/up.lua" = "function Str(el)\n  el.text = el.text:upper()\n  return el\nend\n" }

