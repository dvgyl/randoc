input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\tb\"}]}]}"

[[case]]
id = "tab-in-json-tab-stop-8"
cmd = ["-f", "json", "-t", "json", "--tab-stop=8"]
input = "{\"pandoc-api-version\":[1,23,1,2],\t\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"ab\tc\"}]}]}"

[[case]]
id = "tab-in-native"
cmd = ["-f", "native", "-t", "json"]
input = "[Para [Str \"a\tb\"], CodeBlock (\"\",[],[]) \"x\ty\"]\n"

[[case]]
id = "tab-in-native-preserved"
cmd = ["-f", "native", "-t", "json", "-p"]
input = "[Para [Str \"a\tb\"], CodeBlock (\"\",[],[]) \"x\ty\"]\n"

[[case]]
id = "output-below-a-file"
cmd = ["-f", "json", "-t", "json", "-o", "a.json/x"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[]}"
files = { "a.json" = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[]}" }
