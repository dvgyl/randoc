# JSON filters (`--filter`, `-F`, `filters:`). Each filter is a small script
# of this file: a shell script without other processes, or a Python script.

[[case]]
id = "filter-shell-changes-the-document"
cmd = ["-f", "markdown", "-t", "native", "--filter", "./up.sh"]
input = "a b\n"
covers = ["opt:filter"]
[case.files]
"up.sh" = '''
#!/bin/sh
while IFS= read -r l || [ -n "$l" ]; do
  printf '%s' "${l//\"c\":\"a\"/\"c\":\"A\"}"
done
'''

[[case]]
id = "filter-python-changes-the-document"
cmd = ["-f", "markdown", "-t", "native", "-F", "./up.py"]
input = "a *b*\n\n# c\n"
covers = ["opt:filter"]
[case.files]
"up.py" = '''
#!/usr/bin/env python3
import json
import sys

doc = json.load(sys.stdin)


def walk(node):
    if isinstance(node, dict):
        if node.get("t") == "Str":
            node["c"] = node["c"].upper()
        for value in node.values():
            walk(value)
    elif isinstance(node, list):
        for value in node:
            walk(value)


walk(doc["blocks"])
doc["blocks"].append({"t": "Para", "c": [{"t": "Str", "c": " ".join(sys.argv[1:])}]})
json.dump(doc, sys.stdout)
'''

