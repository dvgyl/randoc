id = "lua-print"
capture_files = {}
cmd = ["-f", "json", "-t", "native", "-o", "out.txt", "-L", "w.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"w.lua" = "print('printed')\n"

[[case]]
id = "lua-warn-quiet"
cmd = ["-f", "json", "-t", "native", "--quiet", "-L", "w.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"w.lua" = "io.stderr:write('still shown\\n')\n"

# The time of the filters: after the metadata options, before the shift of the headings.

[[case]]
id = "lua-before-shift-heading-level"
cmd = ["-f", "json", "-t", "native", "--shift-heading-level-by=1", "-L", "see.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Header\",\"c\":[1,[\"h\",[],[]],[{\"t\":\"Str\",\"c\":\"h\"}]]},{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"see.lua" = "function Pandoc(doc)\n  local levels = {}\n  for _, b in ipairs(doc.blocks) do\n    if b.t == 'Header' then levels[#levels + 1] = tostring(b.level) end\n  end\n  local keys = {}\n  for k in pairs(doc.meta) do keys[#keys + 1] = k end\n  table.sort(keys)\n  doc.blocks:insert(pandoc.Para({pandoc.Str(table.concat(keys, ',') .. ';' .. table.concat(levels, ','))}))\n  return doc\nend\n"

[[case]]
id = "lua-after-metadata"
cmd = ["-f", "json", "-t", "native", "-s", "-M", "k=v", "--metadata-file=m.yaml", "-L", "see.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Header\",\"c\":[1,[\"h\",[],[]],[{\"t\":\"Str\",\"c\":\"h\"}]]},{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"see.lua" = "function Pandoc(doc)\n  local levels = {}\n  for _, b in ipairs(doc.blocks) do\n    if b.t == 'Header' then levels[#levels + 1] = tostring(b.level) end\n  end\n  local keys = {}\n  for k in pairs(doc.meta) do keys[#keys + 1] = k end\n  table.sort(keys)\n  doc.blocks:insert(pandoc.Para({pandoc.Str(table.concat(keys, ',') .. ';' .. table.concat(levels, ','))}))\n  return doc\nend\n"
"m.yaml" = "f: 1\n"

[[case]]
id = "lua-heading-shift-sees-filter-headings"
cmd = ["-f", "json", "-t", "native", "--shift-heading-level-by=1", "-L", "add.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Header\",\"c\":[1,[\"h\",[],[]],[{\"t\":\"Str\",\"c\":\"h\"}]]},{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"add.lua" = "function Pandoc(doc)\n  doc.blocks:insert(pandoc.Header(2, 'n'))\n  return doc\nend\n"

[[case]]
id = "lua-before-citeproc-error"
cmd = ["-f", "json", "-t", "native", "-L", "e.lua", "--citeproc"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"e.lua" = "error('before citeproc')\n"

[[case]]
id = "lua-metadata-change-reaches-the-writer"
cmd = ["-f", "json", "-t", "native", "-s", "-L", "m.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"m.lua" = "function Meta(m)\n  m.added = pandoc.MetaString('yes')\n  return m\nend\n"

# Under `--sandbox` the filter runs in full mode (ADR 11).

[[case]]
id = "lua-sandbox-reads-a-file"
cmd = ["-f", "json", "-t", "native", "--sandbox", "-L", "r.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"r.lua" = "function Pandoc(doc)\n  doc.blocks:insert(pandoc.Para({pandoc.Str(io.open('data.txt'):read('l'))}))\n  return doc\nend\n"
"data.txt" = "secret\n"

[[case]]
id = "lua-sandbox-data-dir"
cmd = ["-f", "json", "-t", "native", "--sandbox", "--data-dir=dd", "-L", "a.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"dd/filters/a.lua" = "function Str(s)\n  if s.text == 'a' then return pandoc.Str('dd') end\nend\n"

[[case]]
id = "lua-sandbox-libraries"
cmd = ["-f", "json", "-t", "native", "--sandbox", "-L", "l.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"l.lua" = "function Pandoc(doc)\n  doc.blocks:insert(pandoc.Para({pandoc.Str(type(io) .. type(os) .. type(debug) .. type(package))}))\n  return doc\nend\n"

