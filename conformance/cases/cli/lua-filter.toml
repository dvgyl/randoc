# Lua filters (`--lua-filter`, `-L`, a Lua item of `filters:`) with own small filters.

# The search of the filter file: the path, then `filters/` of the user data folder.

[[case]]
id = "lua-path"
cmd = ["-f", "json", "-t", "native", "-L", "a.lua"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[{\"t\":\"Para\",\"c\":[{\"t\":\"Str\",\"c\":\"a\"}]}]}"
covers = ["opt:lua-filter"]
[case.files]
"a.lua" = "function Str(s)\n  if s.text == 'a' then return pandoc.Str('aL') end\nend\n"

