# The request headers of PANDOC_STATE: the first value of each exact name (cli-R9-18).

[[case]]
id = "request-headers-1"
cmd = ["-f", "json", "-t", "native", "-L", "h.lua", "--request-header=user-agent:x"]
input = "{\"pandoc-api-version\":[1,23,1,2],\"meta\":{},\"blocks\":[]}"
[case.files]
"h.lua" = '''
function Pandoc(d)
  local t = {}
  for _, p in ipairs(PANDOC_STATE.request_headers) do t[#t+1] = p[1] .. "=" .. p[2] end
  return pandoc.Pandoc{pandoc.Para{pandoc.Str(table.concat(t, ";"))}}
end
'''

