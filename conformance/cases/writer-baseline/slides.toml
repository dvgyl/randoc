from = "native"
to = ["revealjs", "s5", "slidy", "slideous", "dzslides"]

[[case]]
id = "paragraphs"
input = '''
[ Para [Str "Lens", Space, Str "check", Space, Str "log."]
, Para [Str "Read", Space, Str "slowly.", SoftBreak, Str "Stop.", LineBreak, Str "Café & <check>"]
]
'''

[[case]]
id = "headings"
input = '''
[ Header 1 ("cap", [], []) [Str "Lens", Space, Str "check"]
, Para [Str "Start", Space, Str "here."]
, Header 2 ("details", ["unnumbered"], []) [Str "Readings"]
, Para [Str "Check", Space, Str "ring."]
]
'''

[[case]]
id = "inline-styles"
input = '''
[ Para [Emph [Str "cap"], Space, Strong [Str "ring"], Space, Code ("", [], []) "a_b + 2", Space, Strikeout [Str "retired"], Space, Str "H", Subscript [Str "2"], Str "O", Space, Str "m", Superscript [Str "2"]]
]
'''

[[case]]
id = "links"
input = '''
[ Para [Link ("", [], []) [Str "Read", Space, Str "the", Space, Str "cap", Space, Str "log"] ("https://example.invalid/log?mode=day&view=full", "Open log"), Space, Link ("", [], []) [Str "section"] ("#ring", "")]
, Header 2 ("ring", [], []) [Str "Log", Space, Str "entry"]
]
'''

[[case]]
id = "image"
input = '''
[ Para [Image ("sample", [], [("width", "24px")]) [Str "Lens", Space, Str "check", Space, Str "sample"] ("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNQjqwHAAGeAPzT8N5xAAAAAElFTkSuQmCC", "Blue pixel")]
]
'''

[[case]]
id = "bullet-list"
input = '''
[ BulletList
    [ [Plain [Str "Check", Space, Str "cap."],
       BulletList [[Plain [Str "Log", Space, Str "24."]]]]
    , [Plain [Str "Check", Space, Str "ring."]]
    ]
]
'''

[[case]]
id = "ordered-list"
input = '''
[ OrderedList (4, UpperRoman, OneParen)
    [ [Para [Str "Open", Space, Str "cap."], Para [Str "Wait", Space, Str "for", Space, Str "the", Space, Str "signal."]]
    , [Para [Str "Close", Space, Str "ring."]]
    ]
]
'''

[[case]]
id = "definition-list"
input = '''
[ DefinitionList
    [ ([Str "Limit"], [[Plain [Str "Highest", Space, Str "permitted", Space, Str "24."]],
                       [Plain [Str "See", Space, Str "the", Space, Str "log."]]])
    , ([Str "Zero"], [[Plain [Str "Start", Space, Str "value."]]])
    ]
]
'''

[[case]]
id = "quote"
input = '''
[ BlockQuote [Para [Quoted DoubleQuote [Str "Check", Space, Str "cap."]], Para [Str "Record", Space, Str "the", Space, Str "result."]]
, Para [Str "Continue", Space, Str "the", Space, Str "test."]
]
'''

[[case]]
id = "code-block"
input = '''
[ CodeBlock ("sample-code", ["python"], []) "value = 24\nprint(value < 25)"
, CodeBlock ("", [], []) "cap\n  ring\n"
]
'''

[[case]]
id = "horizontal-rule"
input = '''
[ Para [Str "Before", Space, Str "the", Space, Str "cap", Space, Str "check."]
, HorizontalRule
, Para [Str "After", Space, Str "the", Space, Str "ring", Space, Str "check."]
]
'''

[[case]]
id = "captioned-table"
input = '''
[ Table ("check-table", [], [])
    (Caption Nothing [Plain [Str "Lens", Space, Str "check", Space, Str "values"]])
    [(AlignLeft, ColWidthDefault), (AlignRight, ColWidthDefault)]
    (TableHead ( "", [], [] ) [Row ( "", [], [] ) [Cell ( "", [], [] ) AlignDefault ( RowSpan 1 ) ( ColSpan 1 ) [Plain [Str "Item"]], Cell ( "", [], [] ) AlignDefault ( RowSpan 1 ) ( ColSpan 1 ) [Plain [Str "Value"]]]])
    [TableBody ( "", [], [] ) ( RowHeadColumns 0 ) []
      [Row ( "", [], [] ) [Cell ( "", [], [] ) AlignDefault ( RowSpan 1 ) ( ColSpan 1 ) [Plain [Str "cap"]], Cell ( "", [], [] ) AlignDefault ( RowSpan 1 ) ( ColSpan 1 ) [Plain [Str "24"]]]]]
    (TableFoot ( "", [], [] ) [])
]
'''

[[case]]
id = "notes"
input = '''
[ Para [Str "cap", Note [Para [Str "Use", Space, Str "the", Space, Str "lower", Space, Str "mark."],
                             Para [Emph [Str "Check", Space, Str "the", Space, Str "scale."]]],
        Space, Str "ring", Note [Para [Str "Use", Space, Str "the", Space, Str "upper", Space, Str "mark."]]]
]
'''

[[case]]
id = "div-and-span"
input = '''
[ Div ("check-panel", ["inspection"], [("lang", "en")])
    [Para [Span ("check-step", ["label"], [("title", "Check location")])
            [Str "Lens", Space, Str "check"], Space, Str "cap"]]
]
'''

[[case]]
id = "standalone-slide-deck"
args = ["--standalone", "--slide-level=2", "--incremental", "--template=inspection.html", "--metadata=title:Lens check"]
files = { "inspection.html" = "<!doctype html>\n<html lang=\"en\">\n<head>\n<title>$title$</title>\n</head>\n<body>\n$body$\n</body>\n</html>\n" }
input = '''
[ Header 1 ("lens-check", [], []) [Str "Lens", Space, Str "check"]
, Header 2 ("remove-cap", [], []) [Str "Remove", Space, Str "the", Space, Str "cap"]
, BulletList [[Plain [Str "Turn", Space, Str "the", Space, Str "ring."]], [Plain [Str "Lift", Space, Str "the", Space, Str "cap."]]]
, HorizontalRule
, Para [Str "Put", Space, Str "the", Space, Str "cap", Space, Str "on", Space, Str "the", Space, Str "tray."]
, Header 2 ("fit-cap", [], []) [Str "Install", Space, Str "the", Space, Str "cap"]
, Para [Str "Turn", Space, Str "the", Space, Str "ring", Space, Str "to", Space, Str "the", Space, Str "mark."]
]
'''
