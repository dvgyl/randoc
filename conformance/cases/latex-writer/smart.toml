# The smart extension of the writer and of the reader.

from = "markdown"
to = ["latex"]

[[case]]
id = "nosmart--x"
to = ["latex-smart"]
input = '''
""x""
'''

[[case]]
id = "readernosmart--x"
from = "markdown-smart"
input = '''
""x""
'''

[[case]]
