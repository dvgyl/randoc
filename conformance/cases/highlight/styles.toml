# Generated by crates/randoc-highlight/tools/data.py cases: the highlight styles.

[[case]]
id = "list-languages"
cmd = ["--list-highlight-languages"]

[[case]]
id = "list-styles"
cmd = ["--list-highlight-styles"]

[[case]]
id = "print-pygments"
cmd = ["--print-highlight-style", "pygments"]

[[case]]
id = "highlighting-css-pygments"
cmd = ["-f", "json", "-t", "html", "-s", "--template=t.html", "--highlight-style=pygments"]
files = { "t.html" = "$highlighting-css$\n" }
input = "{\"pandoc-api-version\": [1, 23, 1], \"meta\": {}, \"blocks\": [{\"t\": \"CodeBlock\", \"c\": [[\"\", [\"rust\"], []], \"fn main() {\\n    println!(\\\"hello, {}\\\", \\\"world\\\");\\n}\"]}]}"

