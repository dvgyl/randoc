# The native reader: each accepted form and each error.
from = "native"
to = ["native"]

[[case]]
id = "pandoc-compact"
input = "Pandoc (Meta {unMeta = fromList [(\"title\",MetaInlines [Str \"T\"])]}) [Para [Str \"x\"]]"

[[case]]
id = "pandoc-pretty"
input = "Pandoc\n  Meta { unMeta = fromList [ ( \"a\" , MetaBool True ) ] }\n  [ Para [ Str \"x\" ] ]"

[[case]]
id = "pandoc-no-parens-meta"
input = "Pandoc Meta {unMeta = fromList []} []"

[[case]]
id = "pandoc-meta-duplicate-keys"
input = "Pandoc (Meta {unMeta = fromList [(\"a\",MetaBool True),(\"a\",MetaBool False)]}) []"

[[case]]
id = "pandoc-meta-unsorted"
input = "Pandoc (Meta {unMeta = fromList [(\"z\",MetaString \"1\"),(\"a\",MetaString \"2\")]}) []"

[[case]]
id = "pandoc-meta-all"
input = "Pandoc (Meta {unMeta = fromList [(\"m\",MetaMap (fromList [(\"l\",MetaList [MetaBlocks [Plain []],MetaString \"s\"])]))]}) []"

[[case]]
id = "blocks"
input = "[Para [Str \"a\"], HorizontalRule]"

[[case]]
id = "block"
input = "Header 1 (\"id\",[\"c\"],[(\"k\",\"v\")]) [Str \"H\"]"

[[case]]
id = "inlines"
input = "[Str \"a\", Space, Emph [Str \"b\"]]"

[[case]]
id = "inline"
input = "Str \"alone\""

[[case]]
id = "empty-list"
input = "[]"

[[case]]
id = "parens-everywhere"
input = "((([((Para ([(Str (\"x\"))])))])))"

[[case]]
id = "whitespace"
input = " \n\t [ Para\n\n [Str\n\"x\"\n]\n]\n\n "

[[case]]
id = "unicode-space"
input = "[ Para [Str \"x\"]　]"

[[case]]
id = "negative-no-parens"
input = "Header -1 (\"\",[],[]) []"

[[case]]
id = "negative-parens"
input = "Header (-1) (\"\",[],[]) []"

[[case]]
id = "negative-space"
input = "Header (- 2) (\"\",[],[]) []"

[[case]]
id = "hex-int"
input = "Header 0x1F (\"\",[],[]) []"

[[case]]
id = "octal-int"
input = "Header 0o17 (\"\",[],[]) []"

[[case]]
id = "int-overflow"
input = "Header 18446744073709551617 (\"\",[],[]) []"

[[case]]
id = "double-int"
input = "Table (\"\",[],[]) (Caption Nothing []) [(AlignDefault,ColWidth 1)] (TableHead (\"\",[],[]) []) [] (TableFoot (\"\",[],[]) [])"

[[case]]
id = "double-forms"
input = "Table (\"\",[],[]) (Caption Nothing []) [(AlignDefault,ColWidth 1.5e-3),(AlignDefault,ColWidth 2E2),(AlignDefault,ColWidth -0.5),(AlignDefault,ColWidth (-1.0e-2)),(AlignDefault,ColWidth 0x10),(AlignDefault,ColWidth 1e400)] (TableHead (\"\",[],[]) []) [] (TableFoot (\"\",[],[]) [])"

[[case]]
id = "double-special"
input = "Table (\"\",[],[]) (Caption Nothing []) [(AlignDefault,ColWidth Infinity),(AlignDefault,ColWidth NaN),(AlignDefault,ColWidth -Infinity),(AlignDefault,ColWidth (-Infinity))] (TableHead (\"\",[],[]) []) [] (TableFoot (\"\",[],[]) [])"

[[case]]
id = "escape-decimal"
input = "Str \"\\233\\&1\\65\""

[[case]]
id = "escape-hex"
input = "Str \"\\x41\\x1F600\""

[[case]]
id = "escape-octal"
