[[case]]
id = "binary-literal"
input = "Header 0b11 (\"\",[],[]) []"

[[case]]
id = "raw-utf8"
input = "Str \"café 😀\""

[[case]]
id = "raw-newline-in-string"
input = "Str \"a\nb\""

[[case]]
id = "citation-record"
input = "Cite [Citation {citationId = \"k\", citationPrefix = [], citationSuffix = [Str \"s\"], citationMode = AuthorInText, citationNoteNum = 3, citationHash = 0}] [Str \"x\"]"

[[case]]
id = "citation-pretty"
input = "Cite\n  [ Citation\n      { citationId = \"k\"\n      , citationPrefix = []\n      , citationSuffix = []\n      , citationMode = NormalCitation\n      , citationNoteNum = -1\n      , citationHash = 0\n      }\n  ]\n  []"

[[case]]
id = "table-full"
input = "Table (\"t\",[],[]) (Caption (Just [Str \"s\"]) [Plain [Str \"c\"]]) [(AlignLeft,ColWidth 0.5),(AlignRight,ColWidthDefault)] (TableHead (\"\",[],[]) [Row (\"\",[],[]) [Cell (\"\",[],[]) AlignCenter (RowSpan 1) (ColSpan 2) [Plain [Str \"h\"]]]]) [TableBody (\"\",[],[]) (RowHeadColumns 1) [] [Row (\"\",[],[]) [Cell (\"\",[],[]) AlignDefault (RowSpan 2) (ColSpan 1) []]]] (TableFoot (\"\",[],[]) [])"

[[case]]
id = "all-blocks"
input = "[Plain [],Para [],LineBlock [[Str \"l\"],[]],CodeBlock (\"\",[\"c\"],[]) \"x\",RawBlock (Format \"html\") \"<p>\",BlockQuote [],OrderedList (3,UpperRoman,TwoParens) [[Plain []]],BulletList [[]],DefinitionList [([Str \"t\"],[[Plain [Str \"d\"]]])],Header 2 (\"\",[],[]) [],HorizontalRule,Figure (\"\",[],[]) (Caption Nothing []) [],Div (\"d\",[],[]) []]"

[[case]]
id = "all-inlines"
input = "[Str \"s\",Emph [],Underline [],Strong [],Strikeout [],Superscript [],Subscript [],SmallCaps [],Quoted SingleQuote [],Code (\"\",[],[]) \"c\",Space,SoftBreak,LineBreak,Math DisplayMath \"m\",RawInline (Format \"tex\") \"\\\\x\",Link (\"\",[],[]) [Str \"l\"] (\"u\",\"t\"),Image (\"\",[],[]) [] (\"i\",\"\"),Note [Para []],Span (\"\",[],[]) []]"

[[case]]
id = "native-of-native"
input = "[ Para\n    [ Str \"Hello\"\n    , Space\n    , Emph [ Str \"world\" ]\n    ]\n, BulletList\n    [ [ Plain [ Str \"a\" ] ] , [ Plain [ Str \"b\" ] ] ]\n]"

[[case]]
id = "format-uppercase"
input = "RawBlock (Format \"HTML\") \"x\""

[[case]]
id = "tuple-parens"
input = "CodeBlock (((\"\",[],[]))) (\"x\")"

[[case]]
id = "metamap-space"
input = "Pandoc (Meta {unMeta = fromList [ ( \"m\" , MetaMap ( fromList [ ] ) ) ]}) []"

[[case]]
id = "char-list-string"
input = "Str ['a','b','\\233','\\n']"

[[case]]
id = "empty-list-string"
input = "Str []"

[[case]]
id = "char-quote"
input = "Str ['\\'','\"']"

[[case]]
id = "trailing-space"
