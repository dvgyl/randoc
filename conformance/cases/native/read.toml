[[case]]
id = "block-figure-caption"
input = "Figure (\"f\",[],[]) (Caption (Just [Str \"s\"]) [Para [Str \"c\"]]) [Plain [Image (\"\",[],[]) [] (\"i.png\",\"\")]]"

[[case]]
id = "block-div-nested"
