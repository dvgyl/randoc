# Tables with each part.
from = "markdown"
to = ["native"]

[[case]]
id = "pipe"
input = "| a | b |\n|---|---|\n| 1 | 2 |"

[[case]]
id = "pipe-align"
input = "| l | c | r | d |\n|:--|:-:|--:|---|\n| 1 | 2 | 3 | 4 |"

[[case]]
id = "pipe-caption"
input = "| a |\n|---|\n| 1 |\n\n: The caption"

[[case]]
id = "pipe-widths"
input = "| a | b |\n|-----|-----------------------------------------------------------------------------------|\n| 1 | 2 |"

[[case]]
id = "pipe-empty-header"
input = "|   |   |\n|---|---|\n| 1 | 2 |"

[[case]]
id = "pipe-inline"
input = "| *a* | `b` |\n|---|---|\n| [l](u) | $x$ |"

[[case]]
id = "simple"
input = "  Right     Left     Center     Default\n-------     ------ ----------   -------\n     12     12        12            12\n    123     123       123          123\n\nTable:  Demonstration"

[[case]]
id = "simple-headerless"
input = "-------     ------\n     12     12\n    123     123\n-------     ------"

[[case]]
id = "multiline"
input = "-------------------------------------------------------------\n Centered   Default           Right Left\n  Header    Aligned         Aligned Aligned\n----------- ------- --------------- -------------------------\n   First    row                12.0 Example of a row that\n                                    spans multiple lines.\n\n  Second    row                 5.0 Here's another one.\n-------------------------------------------------------------\n\nTable: Here's the caption."

[[case]]
id = "grid"
input = "+---------------+---------------+\n| Fruit         | Price         |\n+===============+===============+\n| Bananas       | $1.34         |\n+---------------+---------------+\n| Oranges       | $2.10         |\n+---------------+---------------+"

[[case]]
id = "grid-blocks"
input = "+-----------+-----------+\n| Head      | Head 2    |\n+===========+===========+\n| - a       | ```       |\n| - b       | code      |\n|           | ```       |\n+-----------+-----------+"

[[case]]
id = "grid-span"
input = "+---+---+\n| a | b |\n+===+===+\n| spans |\n+---+---+\n| c | d |\n+---+---+"

[[case]]
id = "grid-rowspan"
input = "+---+---+\n| a | b |\n+   +---+\n|   | c |\n+---+---+"

[[case]]
id = "grid-foot"
input = "+---+---+\n| a | b |\n+===+===+\n| 1 | 2 |\n+===+===+\n| f | g |\n+===+===+"

[[case]]
id = "grid-align"
input = "+-----+-----+\n| a   | b   |\n+:====+====:+\n| 1   | 2   |\n+-----+-----+"

[[case]]
id = "table-attr-caption"
input = "| a |\n|---|\n| 1 |\n\n: Cap {#tbl:x .c}"

