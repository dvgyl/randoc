# rebase_relative_paths and several input files. The inputs are written for Randoc.

[[case]]
id = "image"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
![alt](img.png)
'''

[[case]]
id = "image-title"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
![alt](img.png "title")
'''

[[case]]
id = "image-dotdot"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
![alt](../img.png) ![b](../../x/y.png)
'''

[[case]]
id = "image-dot"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
![alt](./img.png)
'''

[[case]]
id = "link"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
