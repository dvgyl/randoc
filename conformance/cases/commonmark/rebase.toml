"sub/doc.md" = '''
[text](dir/other.md) [b](../up.md)
'''

[[case]]
id = "link-query"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
[text](other.md?x=1#frag)
'''

[[case]]
id = "ref-link"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
[text][r]

[r]: other.md "T"
'''

[[case]]
id = "ref-image"
cmd = ["-f", "commonmark+rebase_relative_paths", "-t", "json", "sub/doc.md"]
[case.files]
"sub/doc.md" = '''
